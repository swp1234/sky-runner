<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3600813755953882" crossorigin="anonymous"></script>
    <meta name="robots" content="max-image-preview:large">

    <!-- SEO -->
    <title>Sky Runner - 우주 비행 아케이드 게임</title>
    <meta name="description" content="우주선을 조종해 장애물을 피하세요! 원탭 조작의 중독성 강한 캐주얼 아케이드 게임.">
    <meta name="keywords" content="게임, 아케이드, 우주, 캐주얼게임, 무료게임, 플래피버드">
    <link rel="canonical" href="https://dopabrain.com/sky-runner/">

    <!-- Open Graph -->
    <meta property="og:title" content="Sky Runner - 나는 몇 점까지 갈 수 있을까?">
    <meta property="og:description" content="우주선을 조종해 장애물을 피하세요! 원탭 조작의 중독성 아케이드 게임">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://dopabrain.com/sky-runner/">
    <meta property="og:locale" content="ko_KR">

    <!-- PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f0f1e">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="icon" type="image/svg+xml" href="icon-192.svg">
    <link rel="apple-touch-icon" href="icon-192.svg">

    <link rel="stylesheet" href="css/style.css">
    <!-- Google Analytics 4 -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-J8GSWM40TV"></script>
    <script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-J8GSWM40TV');</script>
    <script src="js/i18n.js"></script>
</head>
<body>
    <!-- Background Stars -->
    <div class="bg-stars" id="bg-stars"></div>

    <!-- Language Selector -->
    <div class="language-selector">
        <button class="lang-btn" id="langBtn" title="Change Language">🌐</button>
        <div class="lang-menu hidden" id="langMenu"></div>
    </div>

    <div class="game-wrapper">
        <!-- === MENU SCREEN === -->
        <div class="screen menu-screen active" id="menu-screen">
            <div class="ad-banner ad-top">
                <span class="ad-placeholder">광고 영역</span>
            </div>

            <div class="menu-content">
                <div class="game-logo">
                    <span class="logo-rocket">🚀</span>
                    <h1>SKY RUNNER</h1>
                    <p class="logo-sub">하늘 달리기</p>
                </div>

                <div class="high-score-display" id="menu-highscore">
                    <span class="hs-label">최고 점수</span>
                    <span class="hs-value" id="hs-value">0</span>
                </div>

                <div class="menu-buttons">
                    <button class="btn-primary btn-start" id="btn-start">
                        <span>게임 시작</span>
                        <span class="btn-icon">▶</span>
                    </button>
                    <button class="btn-secondary btn-skins" id="btn-skins">
                        <span>🚀 스킨 보관함</span>
                    </button>
                    <button class="btn-secondary btn-themes" id="btn-themes">
                        <span>🎨 테마 선택</span>
                    </button>
                    <button class="btn-secondary btn-stats" id="btn-stats">
                        <span>📊 통계</span>
                    </button>
                </div>

                <p class="menu-hint">터치 또는 스페이스바로 조작</p>
            </div>
        </div>

        <!-- === GAME SCREEN === -->
        <div class="screen game-screen" id="game-screen">
            <div class="game-hud">
                <div class="hud-score" id="hud-score">0</div>
                <button class="hud-pause" id="btn-pause" aria-label="일시정지">⏸</button>
            </div>
            <canvas id="game-canvas"></canvas>
            <div class="tap-hint" id="tap-hint">탭하여 시작!</div>
        </div>

        <!-- === PAUSE OVERLAY === -->
        <div class="overlay pause-overlay hidden" id="pause-overlay">
            <div class="overlay-card">
                <h2>일시정지</h2>
                <div class="pause-buttons">
                    <button class="btn-primary" id="btn-resume">계속하기</button>
                    <button class="btn-secondary" id="btn-quit">메뉴로</button>
                </div>
            </div>
        </div>

        <!-- === GAMEOVER SCREEN === -->
        <div class="screen gameover-screen hidden" id="gameover-screen">
            <div class="gameover-card">
                <h2 class="go-title">게임 오버 💥</h2>

                <div class="go-scores">
                    <div class="go-score-main">
                        <span class="go-label">점수</span>
                        <span class="go-value" id="go-score">0</span>
                    </div>
                    <div class="go-score-best">
                        <span class="go-label">최고</span>
                        <span class="go-value" id="go-best">0</span>
                    </div>
                </div>

                <div class="go-rank" id="go-rank">
                    <span class="rank-icon">🌱</span>
                    <span class="rank-title">초보 조종사</span>
                </div>

                <div class="go-new-record hidden" id="go-new-record">🎉 새 기록!</div>

                <div class="go-buttons">
                    <button class="btn-revive" id="btn-revive">
                        <span class="revive-icon">📺</span>
                        <span>광고 보고 부활하기</span>
                    </button>
                    <button class="btn-primary btn-retry" id="btn-retry">
                        <span>다시 하기</span>
                    </button>
                    <div class="go-sub-buttons">
                        <button class="btn-share" id="btn-share">📤 공유</button>
                        <button class="btn-menu" id="btn-menu">🏠 메뉴</button>
                    </div>
                </div>

                <div class="recommendations-section">
                    <div class="rec-title">이것도 해보세요</div>
                    <div class="rec-grid">
                        <a href="https://dopabrain.com/stack-tower/" class="rec-card" target="_blank">
                            <span class="rec-icon">🏗️</span>
                            <span class="rec-info">
                                <span class="rec-name">Stack Tower</span>
                                <span class="rec-desc">타이밍에 맞춰 블록을 쌓아라!</span>
                            </span>
                        </a>
                        <a href="https://dopabrain.com/zigzag-runner/" class="rec-card" target="_blank">
                            <span class="rec-icon">🏃</span>
                            <span class="rec-info">
                                <span class="rec-name">Zigzag Runner</span>
                                <span class="rec-desc">방향 전환 아케이드 게임!</span>
                            </span>
                        </a>
                        <a href="https://dopabrain.com/emoji-merge/" class="rec-card" target="_blank">
                            <span class="rec-icon">🧬</span>
                            <span class="rec-info">
                                <span class="rec-name">이모지 머지</span>
                                <span class="rec-desc">이모지 합쳐 진화시키기!</span>
                            </span>
                        </a>
                    </div>
                </div>
            </div>

            <div class="ad-banner ad-bottom-go">
                <span class="ad-placeholder">광고 영역</span>
            </div>
        </div>

        <!-- === SKINS SCREEN === -->
        <div class="screen skins-screen hidden" id="skins-screen">
            <div class="skins-header">
                <button class="btn-back" id="btn-skins-back">← 뒤로</button>
                <h2>스킨 보관함</h2>
            </div>
            <div class="skins-grid" id="skins-grid"></div>
        </div>

        <!-- === THEMES SCREEN === -->
        <div class="screen themes-screen hidden" id="themes-screen">
            <div class="themes-header">
                <button class="btn-back" id="btn-themes-back">← 뒤로</button>
                <h2>테마 선택</h2>
            </div>
            <div class="themes-grid" id="themes-grid"></div>
        </div>

        <!-- === STATS SCREEN === -->
        <div class="screen stats-screen hidden" id="stats-screen">
            <div class="stats-header">
                <button class="btn-back" id="btn-stats-back">← 뒤로</button>
                <h2>통계</h2>
            </div>
            <div class="stats-content" id="stats-content"></div>
        </div>

        <!-- === INTERSTITIAL AD OVERLAY === -->
        <div class="overlay interstitial-overlay hidden" id="interstitial-overlay">
            <div class="interstitial-card">
                <p class="interstitial-label">광고</p>
                <div class="interstitial-placeholder">광고 영역 (전면)</div>
                <div class="interstitial-timer">
                    <span id="ad-countdown">5</span>초 후 닫기
                </div>
                <button class="btn-close-ad hidden" id="btn-close-ad">✕ 닫기</button>
            </div>
        </div>
    </div>

    <script src="js/skins-data.js"></script>
    <script src="js/titles-data.js"></script>
    <script src="js/obstacles-data.js"></script>
    <script src="js/themes-data.js"></script>
    <script src="js/game.js"></script>
</body>
</html>
